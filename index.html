<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infinity Clock</title>
  <style>
    :root {
      color-scheme: dark;
      --accent: #b99aff;
      --panel: rgba(255,255,255,.10);
      --border: rgba(255,255,255,.20);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 20% 15%, #542b9d 0, transparent 42%),
        radial-gradient(ellipse at 85% 85%, #173f91 0, transparent 43%),
        #11142b;
    }
    main {
      width: min(100%, 560px);
      padding: 30px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.055));
      box-shadow: 0 24px 80px #05061788, inset 0 1px 0 #ffffff25;
      backdrop-filter: blur(22px);
    }
    h1 { margin: 0 0 22px; font-size: 1.35rem; letter-spacing: .04em; }
    nav { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    button, input {
      color: white;
      font: inherit;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
    }
    button { padding: 10px 16px; cursor: pointer; transition: .2s; }
    button:hover, button.active { background: var(--accent); color: #171027; }
    #display {
      margin: 35px 0 10px;
      font-size: clamp(2.8rem, 12vw, 5rem);
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: .03em;
    }
    #date { min-height: 1.5em; color: #e0d8fa; }
    .controls { display: flex; justify-content: center; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
    .entry { margin-top: 20px; }
    input { width: 85px; padding: 10px; text-align: center; }
    .hidden { display: none; }
    #message { min-height: 1.5em; margin-top: 16px; color: #ffe48a; }
    @media (max-width: 420px) { main { padding: 22px 16px; } }
  </style>
</head>
<body>
  <main>
    <h1>✦ Infinity Clock</h1>
    <nav aria-label="Clock modes">
      <button class="mode active" data-mode="clock">Clock</button>
      <button class="mode" data-mode="stopwatch">Stopwatch</button>
      <button class="mode" data-mode="timer">Timer</button>
    </nav>

    <div id="display">--:--:--</div>
    <div id="date"></div>

    <div id="stopwatchControls" class="controls hidden">
      <button id="startWatch">Start</button>
      <button id="resetWatch">Reset</button>
    </div>

    <div id="timerEntry" class="entry hidden">
      <input id="minutes" type="number" min="0" max="999" placeholder="Minutes" aria-label="Timer minutes">
      <input id="seconds" type="number" min="0" max="59" placeholder="Seconds" aria-label="Timer seconds">
    </div>
    <div id="timerControls" class="controls hidden">
      <button id="startTimer">Start timer</button>
      <button id="resetTimer">Reset</button>
    </div>
    <div id="message"></div>
  </main>

  <script>
    const display = document.getElementById("display");
    const dateLine = document.getElementById("date");
    const message = document.getElementById("message");
    const watchControls = document.getElementById("stopwatchControls");
    const timerEntry = document.getElementById("timerEntry");
    const timerControls = document.getElementById("timerControls");

    let mode = "clock";
    let watchElapsed = 0;
    let watchStartedAt = 0;
    let watchRunning = false;
    let timerRemaining = 0;
    let timerEndsAt = 0;
    let timerRunning = false;

    function formatTime(totalSeconds, showHours = true) {
      totalSeconds = Math.max(0, Math.floor(totalSeconds));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const pad = n => String(n).padStart(2, "0");
      return showHours || hours ? `${pad(hours)}:${pad(minutes)}:${pad(seconds)}` : `${pad(minutes)}:${pad(seconds)}`;
    }

    function setMode(nextMode) {
      mode = nextMode;
      document.querySelectorAll(".mode").forEach(button =>
        button.classList.toggle("active", button.dataset.mode === mode)
      );
      watchControls.classList.toggle("hidden", mode !== "stopwatch");
      timerEntry.classList.toggle("hidden", mode !== "timer");
      timerControls.classList.toggle("hidden", mode !== "timer");
      dateLine.textContent = "";
      message.textContent = "";
      update();
    }

    document.querySelectorAll(".mode").forEach(button =>
      button.addEventListener("click", () => setMode(button.dataset.mode))
    );

    document.getElementById("startWatch").addEventListener("click", event => {
      if (watchRunning) {
        watchElapsed += Date.now() - watchStartedAt;
        watchRunning = false;
        event.target.textContent = "Start";
      } else {
        watchStartedAt = Date.now();
        watchRunning = true;
        event.target.textContent = "Pause";
      }
      update();
    });

    document.getElementById("resetWatch").addEventListener("click", () => {
      watchElapsed = 0;
      watchRunning = false;
      document.getElementById("startWatch").textContent = "Start";
      update();
    });

    document.getElementById("startTimer").addEventListener("click", () => {
      if (timerRunning) return;
      if (timerRemaining <= 0) {
        const mins = Number(document.getElementById("minutes").value) || 0;
        const secs = Number(document.getElementById("seconds").value) || 0;
        timerRemaining = mins * 60 + secs;
      }
      if (timerRemaining <= 0) {
        message.textContent = "Enter a time first.";
        return;
      }
      timerEndsAt = Date.now() + timerRemaining * 1000;
      timerRunning = true;
      message.textContent = "";
      update();
    });

    document.getElementById("resetTimer").addEventListener("click", () => {
      timerRunning = false;
      timerRemaining = 0;
      display.textContent = "00:00";
      message.textContent = "";
    });

    function update() {
      if (mode === "clock") {
        const now = new Date();
        display.textContent = now.toLocaleTimeString([], { hour12: true });
        dateLine.textContent = now.toLocaleDateString([], {
          weekday: "long", month: "long", day: "numeric", year: "numeric"
        });
      } else if (mode === "stopwatch") {
        const elapsed = watchElapsed + (watchRunning ? Date.now() - watchStartedAt : 0);
        display.textContent = formatTime(elapsed / 1000);
      } else if (mode === "timer") {
        if (timerRunning) {
          timerRemaining = Math.max(0, Math.ceil((timerEndsAt - Date.now()) / 1000));
          if (timerRemaining === 0) {
            timerRunning = false;
            message.textContent = "Timer finished!";
          }
        }
        display.textContent = formatTime(timerRemaining, false);
      }
    }

    setInterval(update, 200);
    update();
  </script>
</body>
</html>
